name: Wyoming Soniox
version: "0.2.1"
slug: wyoming_soniox
description: Fast streaming speech-to-text and text-to-speech with Soniox for Assist (Wyoming protocol)
url: https://github.com/darkdarin/wyoming-soniox
# Prebuilt multi-arch image published by .github/workflows/release.yml; wyoming_soniox_app/build.sh drops this
# line for a local app that the Supervisor builds from source.
image: ghcr.io/darkdarin/wyoming-soniox
arch:
  - aarch64
  - amd64
init: false
discovery:
  - wyoming
options:
  api_key: ""
  language: ru
  model: stt-rt-v5
  language_hints_strict: true
  context_terms: []
  context_text: ""
  endpoint_latency_adjustment_level: 2
  endpoint_sensitivity: 0.3
  max_endpoint_delay_ms: 1500
  max_utterance_s: 15
  wake_words: []
  tts_voice: ""
  tts_language: ru
  tts_speed: 1.0
  debug_logging: false
schema:
  api_key: password
  language: list(af|ar|az|be|bg|bn|bs|ca|cs|cy|da|de|el|en|es|et|eu|fa|fi|fr|gl|gu|he|hi|hr|hu|id|it|ja|kk|kn|ko|lt|lv|mk|ml|mr|ms|nl|no|pa|pl|pt|ro|ru|sk|sl|sq|sr|sv|sw|ta|te|th|tl|tr|uk|ur|vi|zh)
  model: str
  language_hints_strict: bool
  context_terms:
    - str
  context_text: str?
  endpoint_latency_adjustment_level: int(0,3)
  endpoint_sensitivity: float(-1,1)
  max_endpoint_delay_ms: int(500,3000)
  max_utterance_s: float(3,60)
  wake_words:
    - str
  tts_voice: str?
  tts_language: list(af|ar|az|be|bg|bn|bs|ca|cs|cy|da|de|el|en|es|et|eu|fa|fi|fr|gl|gu|he|hi|hr|hu|id|it|ja|kk|kn|ko|lt|lv|mk|ml|mr|ms|nl|no|pa|pl|pt|ro|ru|sk|sl|sq|sr|sv|sw|ta|te|th|tl|tr|uk|ur|vi|zh)
  tts_speed: float(0.7,1.3)
  debug_logging: bool
ports:
  "10300/tcp": null
