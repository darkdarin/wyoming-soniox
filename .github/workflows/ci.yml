name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Run tests
        run: uv run pytest -q

  # The app image as the release builds it (amd64 only, not published): catches Dockerfile breakage before a tag.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the build context
        id: stage
        run: echo "dir=$(wyoming_soniox_app/build.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ steps.stage.outputs.dir }}
          platforms: linux/amd64
          build-args: BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.14-alpine3.22
          push: false
          load: true
          tags: wyoming-soniox:ci
          cache-from: type=gha,scope=amd64
      # Docker users run the server directly, without the app's run.sh (see README).
      - name: Run the server command outside Home Assistant
        run: docker run --rm wyoming-soniox:ci python3 -m wyoming_soniox --version
