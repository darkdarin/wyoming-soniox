[project]
name = "wyoming-soniox"
version = "0.2.0"
description = "Wyoming protocol server for Soniox real-time speech-to-text"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Pavel Babushkin", email = "idarksoft@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "websockets>=14",
    "wyoming>=1.10.2,<2",
]

[project.scripts]
wyoming-soniox = "wyoming_soniox.__main__:main"

[project.urls]
Repository = "https://github.com/darkdarin/wyoming-soniox"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "BLE"]
